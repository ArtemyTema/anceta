<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Анкета в клан ReallyWorld</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 16px;
    }
    .card {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .subtitle { color: var(--muted); margin: 0 0 28px; font-size: 15px; }
    .field { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 15px; }
    input, textarea, select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 90px; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
    button {
      background: var(--accent);
      color: #06202b;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }
    button:hover { filter: brightness(1.1); }
    .result {
      display: none;
      margin-top: 28px;
      background: #0b1220;
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 20px;
    }
    .result h2 { margin-top: 0; font-size: 18px; }
    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 13px;
      color: #cbd5e1;
      max-height: 320px;
      overflow: auto;
    }
    .actions { display: flex; gap: 10px; margin-top: 12px; }
    .actions button { width: auto; flex: 1; padding: 10px; font-size: 14px; }
    .secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Анкета в клан ReallyWorld</h1>
    <p class="subtitle">Отвечай честно и подробно — это поможет принять решение.</p>

    <form id="form">
      <div class="field">
        <label>Ник на ReallyWorld и Ваш донат:</label>
        <input name="Ник на ReallyWorld и Ваш донат" type="text" required placeholder="Например: wvex | Премиум" />
      </div>
      <div class="field">
        <label>Сколько часов готовы играть с кланом (в день):</label>
        <input name="Сколько часов готовы играть с кланом (в день)" type="text" required placeholder="Например: 2-3" />
      </div>
      <div class="field">
        <label>Сколько вам лет:</label>
        <input name="Сколько вам лет" type="number" min="1" max="120" required placeholder="Возраст" />
      </div>
      <div class="field">
        <label>Оценка себя в PvP / PVE (от 1 до 100):</label>
        <input name="Оценка себя в PvP / PVE (от 1 до 100)" type="text" required placeholder="Например: PvP — 70, PvE — 50" />
      </div>
      <div class="field">
        <label>В каких кланах раньше были:</label>
        <textarea name="В каких кланах раньше были" placeholder="Перечисли кланы"></textarea>
      </div>
      <div class="field">
        <label>Готовы пройти проверку на читы? (да/нет):</label>
        <select name="Готовы пройти проверку на читы? (да/нет)" required>
          <option value="">Выбери...</option>
          <option>да</option>
          <option>нет</option>
        </select>
      </div>
      <div class="field">
        <label>Расскажите о себе (1-5 предложений):</label>
        <textarea name="Расскажите о себе (1-5 предложений)" required placeholder="Пара предложений о себе"></textarea>
      </div>
      <div class="field">
        <label>Готовы ли вы активно быть в войсках, ходить на талики?:</label>
        <select name="Готовы ли вы активно быть в войсках, ходить на талики?" required>
          <option value="">Выбери...</option>
          <option>да</option>
          <option>нет</option>
          <option>иногда</option>
        </select>
      </div>
      <div class="field">
        <label>Почему мы должны взять именно вас в клан?:</label>
        <textarea name="Почему мы должны взять именно вас в клан?" required placeholder="Твои причины"></textarea>
      </div>
      <div class="field">
        <label>Готовы ли вы переходить в клане на другие грифы?:</label>
        <select name="Готовы ли вы переходить в клане на другие грифы?" required>
          <option value="">Выбери...</option>
          <option>да</option>
          <option>нет</option>
          <option>зависит от ситуации</option>
        </select>
      </div>
      <div class="field">
        <label>Кто вас пригласил:</label>
        <input name="Кто вас пригласил" type="text" required placeholder="Ник пригласившего" />
      </div>

      <button type="submit">Показать готовую анкету</button>
    </form>

    <div class="result" id="result">
      <h2>Готовая анкета</h2>
      <pre id="output"></pre>
      <div class="actions">
        <button type="button" id="copy">Скопировать</button>
        <button type="button" id="download" class="secondary">Скачать .txt</button>
      </div>
      <p class="hint">Можешь скопировать текст и отправить его в Discord/Telegram.</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('form');
    const result = document.getElementById('result');
    const output = document.getElementById('output');
    let text = '';

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const lines = ['АНКЕТА В КЛАН REALLYWORLD', ''];
      for (const el of form.elements) {
        if (!el.name) continue;
        lines.push(el.name + ' ' + (el.value.trim() || '—'));
      }
      text = lines.join('\n');
      output.textContent = text;
      result.style.display = 'block';
      result.scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(text); } catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
    });

    document.getElementById('download').addEventListener('click', () => {
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'anketa-klan.txt';
      a.click();
      URL.revokeObjectURL(a.href);
    });
  </script>
</body>
</html>
